[project]
name = "curatwin"
version = "1.0.0"
description = "CuraTwin health monitoring application"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "sqlalchemy==2.0.23",
    "psycopg2-binary==2.9.10",
    "pydantic[email]==2.5.2",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "python-multipart==0.0.6",
    "scikit-learn==1.4.2",
    "numpy==1.26.4",
    "joblib==1.3.2",
]

[dependency-groups]
dev = ["pytest==7.4.3", "httpx==0.25.2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
